# Ricetta di compilazione per Codemagic (un computer nel cloud).
#
# Produce l'APK Android (da installare o da mettere nelle Releases di
# GitHub). Le build Android si possono fare anche sul PC con
# `flutter build apk --release`: questa serve per averle uguali ogni volta.
# Su Codemagic: Start new build → workflow "Android".
#
# ATTENZIONE: per ora l'APK è firmato con la chiave di debug (vedi
# android/app/build.gradle.kts). Va bene per provarlo, non per il Play Store:
# la firma di release la aggiungeremo con il workflow per l'AAB.

workflows:
  android:
    name: Android
    # Il piano gratuito di Codemagic include i minuti sul Mac M2,
    # che compila benissimo anche per Android.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      # Il plugin Android di Gradle vuole Java 17.
      java: 17
    scripts:
      - name: Scarica i pacchetti Dart
        script: flutter pub get

      - name: Controlla il codice
        script: flutter analyze

      - name: Esegui i test
        script: flutter test

      - name: Compila l'APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
