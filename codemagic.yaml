# Ricetta di compilazione per Codemagic (un computer nel cloud).
#
# Produce gli APK Android (da installare o da mettere nelle Releases di
# GitHub). Le build Android si possono fare anche sul PC con
# `flutter build apk --release --split-per-abi`: questa serve per averle
# uguali ogni volta.
# Su Codemagic: Start new build → workflow "Android".
#
# ATTENZIONE: per ora l'APK è firmato con la chiave di debug (vedi
# android/app/build.gradle.kts). Va bene per provarlo, non per il Play Store:
# la firma di release la aggiungeremo con il workflow per l'AAB.

workflows:
  android:
    name: Android
    # Il piano gratuito di Codemagic include i minuti sul Mac M2,
    # che compila benissimo anche per Android.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      # Il plugin Android di Gradle vuole Java 17.
      java: 17
    scripts:
      - name: Scarica i pacchetti Dart
        script: flutter pub get

      - name: Controlla il codice
        script: flutter analyze

      - name: Esegui i test
        script: flutter test

      # Un APK per tipo di processore: ~10 MB l'uno (librerie native compresse,
      # vedi build.gradle.kts) invece di ~60 MB dell'APK universale.
      # arm64 va su quasi tutti i telefoni, armeabi-v7a sui vecchi a 32 bit.
      - name: Compila gli APK
        script: flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
