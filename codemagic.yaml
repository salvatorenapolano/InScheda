# Ricetta di compilazione per Codemagic (un Mac nel cloud).
#
# Produce un file myWorkout.ipa NON firmato: la firma la mette Sideloadly
# sul tuo PC con il tuo Apple ID, al momento dell'installazione.
# Su Codemagic: Start new build → workflow "iOS per Sideloadly".

workflows:
  ios-sideload:
    name: iOS per Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Scarica i pacchetti Dart
        script: flutter pub get

      - name: Esegui i test
        script: flutter test

      # release: su iPhone una build "debug" non si apre senza debugger.
      # --no-codesign: niente certificati qui, firma Sideloadly.
      - name: Compila per iPhone
        script: flutter build ios --release --no-codesign

      # Un .ipa è solo uno zip con dentro la cartella Payload/Runner.app.
      - name: Crea il file .ipa
        script: |
          rm -rf Payload myWorkout.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr myWorkout.ipa Payload

    artifacts:
      - myWorkout.ipa
